name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24'

jobs:
  # Job 1: Lint and Type Check
  lint-and-typecheck:
    name: Lint & Type Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Run Biome (Root)
        run: npm run lint --if-present
        continue-on-error: true

      # Must target the leaf projects: the root tsconfig.json is solution-style
      # (files: [] + references), so a bare `tsc --noEmit` resolves zero input
      # files and passes unconditionally.
      - name: TypeScript Check (Root — src + config files)
        run: npm run typecheck

  # Job 2: Unit Tests (frontend)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests with Coverage
        run: npm run test:coverage
        continue-on-error: false

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: ./coverage/
          retention-days: 7

  # Job 3: Build Verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Build Frontend
        env:
          VITE_API_URL: https://api.example.com
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: ./dist
          retention-days: 7

  # Job 4: Workers CI (production API)
  workers-ci:
    name: Workers CI (tsc + test + dry-run)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workers dependencies
        working-directory: ./workers/tcad-api
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./workers/tcad-api
        run: npx prisma generate

      - name: TypeScript Check (workers)
        working-directory: ./workers/tcad-api
        run: npx tsc --noEmit

      # The scripts typecheck needs BOTH dependency trees:
      #   workers/tcad-api/node_modules — @prisma/client (scripts/tsconfig.json
      #     paths) and @prisma/adapter-d1 (workers/tcad-api/scripts-client.ts,
      #     pulled in via scripts/lib/d1-prisma.ts)
      #   root node_modules — the tsc binary itself, plus @types/node and
      #     vitest types used by scripts/**
      - name: Install root dependencies
        run: npm ci

      - name: TypeScript Check (scripts + utils)
        run: npx tsc --noEmit -p scripts/tsconfig.json

      - name: Run Workers tests
        working-directory: ./workers/tcad-api
        run: npm test

      - name: Wrangler deploy dry-run
        working-directory: ./workers/tcad-api
        run: npx wrangler deploy --dry-run
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Job 5: Security Checks
  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit (Root)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # Dependency Review (PRs only)
  # NOTE: Disabled - Requires GitHub Advanced Security to be enabled
  # dependency-review:
  #   name: Dependency Review
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v7
  #
  #     - name: Dependency Review
  #       uses: actions/dependency-review-action@v5
  #       with:
  #         fail-on-severity: moderate

  # Summary Job
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, build, workers-ci, security]
    if: always()

    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]] || \
             [[ "${{ needs.workers-ci.result }}" == "failure" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"

      - name: Post status
        if: success()
        run: echo "✅ CI Pipeline passed all checks"
