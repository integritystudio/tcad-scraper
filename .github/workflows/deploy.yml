name: Deploy to GitHub Pages

# ==================================
# GitHub Pages Deployment Workflow
# ==================================
# This workflow builds and deploys the frontend to GitHub Pages
#
# Doppler Configuration:
#   - Project: integrity-studio
#   - Environment: prd
#   - Token: Stored in GitHub Secrets as DOPPLER_TOKEN_PROD
#
# Note: GitHub Pages only deploys static frontend files
# Backend services run separately and are NOT deployed via GitHub Pages
# ==================================

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install dependencies
        run: npm ci && npm rebuild

      - name: Build with Vite
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: |
          # Set frontend port
          export FRONTEND_PORT="5174"

          # Fetch environment variables from Doppler (integrity-studio project)
          if [ -n "$DOPPLER_TOKEN" ]; then
            # Get VITE_API_URL from Doppler or use production default
            export VITE_API_URL=$(doppler secrets get VITE_API_URL --plain --project integrity-studio --config prd 2>/dev/null || echo "https://api.alephatx.info/api")

            # Get CLOUDFLARE_D1_TOKEN for build-time constant generation
            # (scripts/generate-build-constants.ts queries D1 via the REST API)
            export CLOUDFLARE_D1_TOKEN=$(doppler secrets get CLOUDFLARE_D1_TOKEN --plain --project integrity-studio --config prd 2>/dev/null || echo "")
          else
            # Fallback if Doppler token is not available
            export VITE_API_URL="https://api.alephatx.info/api"
          fi

          echo "Building with API_URL: $VITE_API_URL"
          echo "Frontend Port: $FRONTEND_PORT"

          # Run build (prebuild script will generate constants from database)
          npm run build

      # Note: Removed "Build db layer" step - not needed for static GitHub Pages deployment
      # The backend services run separately and are not deployed via GitHub Pages

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
