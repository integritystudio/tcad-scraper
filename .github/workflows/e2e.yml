name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        # VITE_API_URL points to production — tests are read-only UI checks
        # against the public property search API; no data mutation occurs.
        run: npm run test:e2e
        env:
          CI: true
          VITE_API_URL: https://api.alephatx.info/api

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results
          path: e2e/test-results/
          retention-days: 7
