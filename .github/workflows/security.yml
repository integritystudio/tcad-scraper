name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # CodeQL Analysis
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
        continue-on-error: true  # Allow failure when code scanning not enabled

  # Dependency Vulnerability Scanning
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run npm audit (Root)
        run: |
          npm audit --audit-level=high --json > npm-audit-root.json || true
          if [ -s npm-audit-root.json ]; then
            echo "## Root Dependencies Audit" >> $GITHUB_STEP_SUMMARY
            npm audit --audit-level=high >> $GITHUB_STEP_SUMMARY || true
          fi
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-reports
          path: npm-audit-root.json
          retention-days: 30

  # OWASP Dependency Check
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        with:
          project: 'tcad-scraper'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
            --enableExperimental
            --failOnCVSS 7
        continue-on-error: true  # Allow failure for pre-existing vulnerabilities

      - name: Upload OWASP results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owasp-dependency-check-report
          path: ${{ github.workspace }}/reports
          retention-days: 30

  # Secret Scanning
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if BASE and HEAD are different
        id: check-commits
        run: |
          BASE_COMMIT=$(git rev-parse origin/${{ github.event.repository.default_branch }} 2>/dev/null || echo "")
          HEAD_COMMIT=$(git rev-parse HEAD)

          if [ "$BASE_COMMIT" = "$HEAD_COMMIT" ]; then
            echo "same=true" >> $GITHUB_OUTPUT
            echo "⚠️ BASE and HEAD commits are the same - will scan filesystem instead" >> $GITHUB_STEP_SUMMARY
          else
            echo "same=false" >> $GITHUB_OUTPUT
            echo "✓ Scanning commits between $BASE_COMMIT and $HEAD_COMMIT" >> $GITHUB_STEP_SUMMARY
          fi

      - name: TruffleHog OSS (Git Scan)
        if: steps.check-commits.outputs.same != 'true'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true  # Allow failure when BASE and HEAD commits are the same

      - name: TruffleHog OSS (Filesystem Scan)
        if: steps.check-commits.outputs.same == 'true'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

  # License Compliance Check
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm ci
        continue-on-error: false

      - name: Check licenses
        run: |
          npx license-checker --summary >> $GITHUB_STEP_SUMMARY
          npx license-checker --json > licenses.json
        continue-on-error: true

      - name: Upload license report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

  # Security Summary
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [codeql, dependency-scan, owasp-dependency-check, secret-scan]
    if: always()

    steps:
      - name: Generate security summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP Check | ${{ needs.owasp-dependency-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check for critical failures
        if: |
          needs.codeql.result == 'failure' ||
          needs.secret-scan.result == 'failure'
        run: |
          echo "❌ Critical security checks failed"
          exit 1

      - name: Success message
        if: success()
        run: echo "✅ All security scans completed successfully"
