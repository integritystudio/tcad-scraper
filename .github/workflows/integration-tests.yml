name: Integration Tests

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug mode'
        required: false
        type: boolean
        default: false

  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/integration-tests.yml'

  pull_request:
    types: [labeled]

env:
  NODE_VERSION: '22'

jobs:
  check-trigger:
    name: Check Trigger Conditions
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if should run
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'run-integration-tests') }}" == "true" ]]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Run Integration Tests
        working-directory: ./server
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
          SENTRY_DSN: ""
          SENTRY_ENABLED: "false"
        run: doppler run --command "npm run test:integration:coverage"

      - name: Upload Integration Coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./server/coverage/integration/lcov.info
          flags: integration
          name: codecov-integration
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Integration Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage-report
          path: ./server/coverage/integration/
          retention-days: 30

      - name: Generate Integration Test Report
        if: always()
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Setup tmate session (debug)
        if: ${{ failure() && github.event.inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

  integration-success:
    name: Integration Tests Success
    runs-on: ubuntu-latest
    needs: [check-trigger, integration-tests]
    if: always() && needs.check-trigger.outputs.should_run == 'true'

    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          echo "All integration tests passed successfully!"
