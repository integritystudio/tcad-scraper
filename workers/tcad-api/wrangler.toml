name = "tcad-api"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
TCAD_YEAR = "2025"
FRONTEND_URL = "https://alephatx.info"

# Hyperdrive connection pooler → Render PostgreSQL
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "e0406d51a79a4440863e0c608390a613"

# Phase 2: Workflows + Queues
[[workflows]]
binding = "SCRAPER_WORKFLOW"
name = "scraper-workflow"
class_name = "ScraperWorkflow"

[[queues.producers]]
queue = "tcad-scraper-jobs"
binding = "SCRAPER_QUEUE"

[[queues.consumers]]
queue = "tcad-scraper-jobs"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "tcad-scraper-dlq"

# Phase 3: KV namespaces
[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "df1bbaf6c7d94db58f9669410b7e6e1d"

[[kv_namespaces]]
binding = "RESPONSE_CACHE"
id = "5eec76ee553e43af892876e9069a74d5"

# Phase 3: Cron triggers
[triggers]
crons = [
  "*/4 * * * *",   # token refresh
  "0 * * * *",     # stale job cleanup
  "0 3 * * *",     # search term optimization
  "0 */6 * * *",   # monitored searches
]

# Phase 5: Production custom domain
[[routes]]
pattern = "api.alephatx.info/*"
zone_name = "alephatx.info"
